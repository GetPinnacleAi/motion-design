<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pinnacle Ai Webinar Video</title>
<style>
  @font-face{font-family:'Inter Tight';src:url(assets/fonts/inter-tight-latin-wght-normal.woff2) format('woff2');font-weight:100 900;font-display:block}
  @font-face{font-family:'Inter';src:url(assets/fonts/inter-latin-wght-normal.woff2) format('woff2');font-weight:100 900;font-display:block}
  :root{
    /* Pinnacle Ai brand tokens (getpinnacle.ai stylesheet) */
    --brand:#004aad; --brand700:#003c8c; --brand300:#9cc0f0; --azure:#6e9bd1; --gold:#ffbe00;
    --navy950:#061530; --navy900:#0a2149; --navy800:#10305f; --navy700:#1b4180;
    --ink:#0a2149; --paper:#f2f5f8; --gray:#8d9bb0; --gray2:#5b6674;
    --blue:#004aad; --green:#30d158; --amber:#ffbe00;
    --panel:#0d2752; --panel2:#143466; --line:#1d3c6e;
    --display:'Inter Tight','Inter',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;
    --text:'Inter',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;background:var(--navy950);overflow:hidden}
  body{font-family:var(--display);-webkit-font-smoothing:antialiased;color:var(--paper)}
  #stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;background:var(--navy950);transform-origin:0 0}
  .scene{position:absolute;inset:0;opacity:0;overflow:hidden}
  .scene.dark{background:var(--navy950);color:#f5f7fa}
  .scene.dark .muted,.scene.dark .sub{color:var(--gray)}
  .scene.light .sub{color:var(--gray2)}
  .scene.light{background:var(--paper);color:var(--ink)}
  .abs{position:absolute}
  .center{left:0;width:1920px;text-align:center}
  .h0{font-weight:700;font-size:200px;letter-spacing:-0.045em;line-height:1}
  .h1{font-weight:700;font-size:128px;letter-spacing:-0.04em;line-height:1.04}
  .h2{font-weight:700;font-size:96px;letter-spacing:-0.035em;line-height:1.05}
  .sub{font-family:var(--text);font-weight:500;font-size:38px;letter-spacing:-0.01em;line-height:1.35;color:var(--gray)}
  .eyebrow{font-weight:600;font-size:30px;letter-spacing:0;margin-bottom:22px}
  .grad{color:var(--brand)}
  .dark .grad{color:var(--gold)}
  .logo{display:inline-flex;align-items:center;gap:.28em}
  .logo img{height:.92em;width:.92em}
  .muted{color:var(--gray)}
  .glow{position:absolute;border-radius:50%;pointer-events:none}

  /* chips */
  .chip{position:absolute;display:flex;align-items:center;gap:16px;padding:22px 34px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:34px;font-weight:600;white-space:nowrap}
  .dot{width:18px;height:18px;border-radius:50%}
  .badge{position:absolute;right:-10px;top:-12px;min-width:44px;height:44px;border-radius:22px;background:#ff3b30;color:#fff;font-size:24px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 12px}

  /* feature cards */
  .fcard{position:absolute;width:420px;height:178px;border-radius:30px;background:#fff;box-shadow:0 2px 6px rgba(10,33,73,.05),0 18px 40px rgba(10,33,73,.08);padding:34px 36px;display:flex;flex-direction:column;justify-content:space-between}
  .fcard svg{width:52px;height:52px}
  .fcard .lbl{font-size:34px;font-weight:650;letter-spacing:-0.02em;color:var(--ink)}
  .ring{position:absolute;inset:-3px;border-radius:33px;border:3px solid transparent;background:var(--brand) border-box;-webkit-mask:linear-gradient(#000 0 0) padding-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:0}

  /* window */
  .win{position:absolute;border-radius:28px;background:var(--panel);border:1px solid var(--line);overflow:hidden;box-shadow:0 40px 120px rgba(0,0,0,.6)}
  .winbar{height:56px;display:flex;align-items:center;gap:12px;padding:0 24px;border-bottom:1px solid var(--line)}
  .winbar i{width:16px;height:16px;border-radius:50%;display:block}
  .row{position:absolute;left:0;width:380px;height:104px;padding:20px 22px;display:flex;gap:18px;border-bottom:1px solid var(--line)}
  .av{width:60px;height:60px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:24px;color:#fff}
  .rname{font-size:24px;font-weight:650;color:#f5f5f7;display:flex;justify-content:space-between;width:260px}
  .rprev{font-size:21px;color:var(--gray);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:260px}
  .tag{font-size:16px;font-weight:700;padding:3px 10px;border-radius:8px;color:#fff;align-self:center}
  .bub{position:absolute;max-width:420px;padding:18px 24px;border-radius:26px;font-size:25px;line-height:1.35;font-weight:500}
  .bub.in{background:var(--panel2);color:#f5f7fa;border-bottom-left-radius:8px}
  .bub.out{background:#1f5fc4;color:#fff;border-bottom-right-radius:8px}

  /* phone */
  .phone{position:absolute;width:430px;height:880px;border-radius:72px;background:#111;padding:16px;box-shadow:0 50px 100px rgba(0,0,0,.25),inset 0 0 0 2px #333}
  .screen{position:relative;width:100%;height:100%;border-radius:58px;overflow:hidden;background:#fff}
  .island{position:absolute;left:50%;top:18px;width:120px;height:34px;margin-left:-60px;border-radius:20px;background:#000;z-index:5}
  .pbub{position:absolute;max-width:300px;padding:14px 18px;border-radius:22px;font-size:21px;line-height:1.35;font-weight:500}
  .pbub.in{left:22px;background:#e9e9eb;color:#000;border-bottom-left-radius:6px}
  .pbub.out{right:22px;background:#0a84ff;color:#fff;border-bottom-right-radius:6px}

  /* kanban */
  .col{position:absolute;width:400px;height:600px;border-radius:28px;background:var(--navy900);border:1px solid var(--line)}
  .colh{position:absolute;left:28px;top:24px;font-size:26px;font-weight:650;color:#f5f5f7;display:flex;gap:12px;align-items:center}
  .cnt{font-size:20px;color:var(--gray);background:var(--panel2);border-radius:12px;padding:2px 12px}
  .kcard{position:absolute;width:360px;height:118px;border-radius:20px;background:var(--panel);border:1px solid var(--line);padding:20px 24px}
  .kcard .t{font-size:25px;font-weight:650;color:#f5f5f7}
  .kcard .m{font-size:20px;color:var(--gray);margin-top:8px;display:flex;justify-content:space-between}
  .flag{position:absolute;left:24px;bottom:-22px;font-size:18px;font-weight:700;background:var(--amber);color:#000;border-radius:10px;padding:6px 12px;white-space:nowrap}

  /* calendar */
  .cal{position:absolute;border-radius:32px;background:#fff;box-shadow:0 30px 80px rgba(10,33,73,.10)}
  .evt{position:absolute;border-radius:12px;padding:10px 14px;font-size:19px;font-weight:650;line-height:1.25}
  .toast{position:absolute;display:flex;align-items:center;gap:18px;background:rgba(10,33,73,.94);color:#fff;border-radius:22px;padding:22px 28px;font-size:24px;font-weight:600;box-shadow:0 20px 50px rgba(0,0,0,.25)}
  .check{width:40px;height:40px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;flex:none}

  /* review cards */
  .rcard{position:absolute;width:520px;height:400px;border-radius:32px;background:var(--panel);border:1px solid var(--line);padding:40px}
  .rlabel{font-size:22px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--gray);margin-bottom:26px}
  .stars{display:flex;gap:10px;margin-bottom:22px}
  .stars svg{width:48px;height:48px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:64px;padding:0 34px;border-radius:32px;font-size:25px;font-weight:700}

  /* chat glass */
  .glass{position:absolute;border-radius:36px;background:rgba(10,33,73,.6);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px)}
  .typing{position:absolute;left:36px;display:flex;gap:8px;padding:20px 24px;background:var(--panel2);border-radius:26px;border-bottom-left-radius:8px}
  .typing b{width:12px;height:12px;border-radius:50%;background:var(--gray);display:block}

  /* onboarding */
  .ocard{position:absolute;width:680px;height:330px;border-radius:36px;background:#fff;box-shadow:0 2px 6px rgba(10,33,73,.05),0 24px 60px rgba(10,33,73,.09);padding:48px 52px}
  .onum{font-size:30px;font-weight:700;margin-bottom:26px}
  .otitle{font-size:56px;font-weight:700;letter-spacing:-0.03em;color:var(--ink)}
  .otext{font-family:var(--text);font-size:32px;font-weight:500;color:var(--gray2);margin-top:14px}
  .tick{font-family:var(--text);display:flex;align-items:center;gap:14px;font-size:30px;font-weight:600;color:var(--ink)}

  .pill{display:inline-flex;align-items:center;gap:12px;padding:12px 22px;border-radius:999px;font-size:22px;font-weight:700}

  /* preview controls */
  #ui{position:fixed;left:0;right:0;bottom:0;padding:12px 16px;display:flex;gap:14px;align-items:center;background:rgba(6,21,48,.85);font:500 14px/1 -apple-system,Inter,sans-serif;color:#ccc;z-index:10}
  #ui input{flex:1}
  #ui button{background:#333;color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer}
  body.render #ui{display:none}
</style>
</head>
<body>
<div id="stage"></div>
<div id="ui"><button id="play">Pause</button><input id="scrub" type="range" min="0" max="1000" value="0"><span id="tc">0:00</span></div>

<script>
/* ---------- timing helpers (pure functions of t, so every frame is reproducible) ---------- */
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const E={
  expo:t=>t>=1?1:1-Math.pow(2,-10*t),
  out:t=>1-Math.pow(1-t,3),
  inOut:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,
  back:t=>{const c1=1.5,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)},
  lin:t=>t
};
const P=(t,a,b,e=E.expo)=>e(clamp((t-a)/(b-a)));
const lerp=(a,b,k)=>a+(b-a)*k;
function S(el,{o=1,x=0,y=0,s=1,blur=0,r=0}={}){
  el.style.opacity=o.toFixed(4);
  el.style.transform=`translate(${x.toFixed(2)}px,${y.toFixed(2)}px) scale(${s.toFixed(4)}) rotate(${r.toFixed(2)}deg)`;
  el.style.filter=blur>0.05?`blur(${blur.toFixed(2)}px)`:'none';
}
/* Apple-style text reveal: rise + unblur in, soften out */
function R(el,t,a,b=1e9,{d=1.1,dy=48,blur=14,s0=1,out=.6}={}){
  const i=P(t,a,a+d), o=1-P(t,b,b+out,E.inOut);
  S(el,{o:i*o,y:(1-i)*dy-(1-o)*24,blur:(1-i)*blur+(1-o)*10,s:lerp(s0,1,i)});
}
const star=c=>`<svg viewBox="0 0 24 24"><path fill="${c}" d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3 6.1 20.6l1.3-6.6L2.5 9.4l6.6-.8z"/></svg>`;
const checkSvg=`<svg width="22" height="22" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

/* ---------- icons for the feature grid ---------- */
const ic=(d)=>`<svg viewBox="0 0 48 48" fill="none" stroke="#004aad" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const ICONS={
  crm:ic('<rect x="5" y="8" width="10" height="32" rx="3"/><rect x="19" y="8" width="10" height="22" rx="3"/><rect x="33" y="8" width="10" height="14" rx="3"/>'),
  web:ic('<rect x="5" y="8" width="38" height="32" rx="5"/><path d="M5 17h38"/><circle cx="11" cy="12.5" r=".6"/><path d="M13 26h12M13 32h20"/>'),
  cal:ic('<rect x="6" y="10" width="36" height="32" rx="5"/><path d="M6 19h36M16 5v9M32 5v9"/><path d="M17 30l5 5 9-10"/>'),
  inbox:ic('<path d="M8 10h32a3 3 0 013 3v18a3 3 0 01-3 3H22l-9 7v-7H8a3 3 0 01-3-3V13a3 3 0 013-3z"/><path d="M14 20h20M14 26h12"/>'),
  follow:ic('<path d="M40 24a16 16 0 11-5-11.6"/><path d="M40 8v8h-8"/><path d="M18 24l4 4 8-8"/>'),
  rev:ic('<path d="M24 6l5.3 11 12 1.5-8.9 8.3 2.4 12L24 33l-10.8 5.8 2.4-12-8.9-8.3 12-1.5z"/>'),
  mkt:ic('<rect x="5" y="11" width="38" height="27" rx="4"/><path d="M6 13l18 13 18-13"/>'),
  pay:ic('<rect x="4" y="11" width="40" height="27" rx="5"/><path d="M4 19h40M11 30h8"/>'),
  ai:ic('<path d="M24 5c1.5 8 4 10.5 12 12-8 1.5-10.5 4-12 12-1.5-8-4-10.5-12-12 8-1.5 10.5-4 12-12z"/><path d="M37 29c.8 4 2 5.2 6 6-4 .8-5.2 2-6 6-.8-4-2-5.2-6-6 4-.8 5.2-2 6-6z"/>')
};

/* ---------- scenes ---------- */
const SCENES=[];
const addScene=(o)=>SCENES.push(o);

/* 1. Intro */
addScene({dur:7,theme:'dark',html:`
  <div class="glow" id="g1" style="left:460px;top:-40px;width:1000px;height:1000px;background:radial-gradient(circle,rgba(0,74,173,.55),rgba(110,155,209,.16) 45%,transparent 70%)"></div>
  <div class="abs center h0" id="wm" style="top:350px"><span class="logo"><img src="assets/brand/mark-light.png" alt="">Pinnacle Ai</span></div>
  <div class="abs center sub" id="tag" style="top:600px;font-size:46px">The all-in-one growth platform for small business.</div>`,
  update(t,$){
    S($('#g1'),{o:P(t,0,3)*0.9,s:lerp(.4,1.1,P(t,0,6,E.out))});
    R($('#wm'),t,.7,1e9,{d:1.6,dy:30,blur:24,s0:1.06});
    R($('#tag'),t,2.3);
  }});

/* 2. Problem */
const CH=[
  ['Text','#30d158',3,-560,-150],['Email','#6e9bd1',7,420,-190],['Instagram','#ff5ca8',2,-640,90],
  ['Facebook','#0a84ff',4,560,60],['WhatsApp','#25d366',1,-300,260],['Phone calls','#ffd60a',2,240,280],
  ['Live chat','#6e9bd1',5,-60,-40],['Reviews','#ff9f0a',6,700,-20]
];
addScene({dur:16,theme:'dark',html:`
  <div class="abs center h2" id="p1" style="top:120px">Your customers are reaching out.</div>
  <div class="abs center h2" id="p2" style="top:120px">From more places than ever.</div>
  ${CH.map((c,i)=>`<div class="chip" id="c${i}" style="left:${960+c[3]-120}px;top:${560+c[4]-40}px"><span class="dot" style="background:${c[1]}"></span>${c[0]}<span class="badge" id="b${i}">${c[2]}</span></div>`).join('')}
  <div class="abs center h1" id="p3" style="top:400px">And leads slip<br><span class="muted">through the cracks.</span></div>`,
  update(t,$){
    R($('#p1'),t,.3,4.9); R($('#p2'),t,5.4,9.9);
    const fall=P(t,10,12,E.inOut);
    CH.forEach((c,i)=>{
      const a=1.0+i*.32, k=P(t,a,a+.9,E.back), ki=P(t,a,a+.5);
      const spread=lerp(1,1.12,P(t,5.4,8,E.inOut));
      const fx=Math.sin(t*.55+i*1.7)*14, fy=Math.cos(t*.5+i*2.3)*12;
      S($('#c'+i),{o:ki*(1-fall*.85),x:c[3]*(spread-1)+fx,y:fy+fall*(120+i*18),s:lerp(.6,1,k),blur:fall*6,r:fall*(i%2?6:-6)});
      // unread counts climb while scene 2b plays
      const extra=Math.floor(P(t,5.6+i*.3,9,E.lin)*(3+i%4));
      $('#b'+i).textContent=c[2]+extra;
    });
    R($('#p3'),t,10.8,1e9,{d:1.4});
  }});

/* 3. Reveal */
addScene({dur:9,theme:'dark',html:`
  <div class="abs center h1" id="q1" style="top:330px">What if it all lived<br>in one place?</div>
  <div class="glow" id="g3" style="left:360px;top:-60px;width:1200px;height:1200px;background:radial-gradient(circle,rgba(0,74,173,.5),rgba(110,155,209,.2) 40%,rgba(255,190,0,.06) 60%,transparent 72%)"></div>
  <div class="abs center sub" id="q2" style="top:330px;font-size:44px">Introducing</div>
  <div class="abs center h0" id="q3" style="top:410px;font-size:230px"><span class="logo"><img src="assets/brand/mark-light.png" alt="">Pinnacle Ai</span></div>`,
  update(t,$){
    R($('#q1'),t,.3,3.9);
    S($('#g3'),{o:P(t,4.4,6.5)*.95,s:lerp(.5,1,P(t,4.4,8,E.out))});
    R($('#q2'),t,4.7); R($('#q3'),t,5.1,1e9,{d:1.8,blur:26,s0:1.08,dy:20});
  }});

/* 4. Features */
const FEAT=[['crm','CRM & Pipelines'],['inbox','Unified Inbox'],['follow','Automated Follow-up'],
  ['web','Funnels & Websites'],['cal','Calendars & Booking'],['rev','Reviews'],
  ['mkt','Email & SMS Marketing'],['pay','Payments'],['ai','AI Employees']];
addScene({dur:18,theme:'light',html:`
  <div class="abs center h2" id="f1" style="top:90px">Everything you need.</div>
  <div class="abs center sub" id="f2" style="top:206px;font-size:44px">Included in every account.</div>
  <div class="abs" id="grid" style="left:0;top:0;width:1920px;height:1080px">
  ${FEAT.map((f,i)=>{const cx=i%3,cy=Math.floor(i/3);return `<div class="fcard" id="fc${i}" style="left:${(1920-1316)/2+cx*448}px;top:${360+cy*206}px">${ICONS[f[0]]}<div class="lbl">${f[1]}${f[0]==='ai'?'<span style="display:block;font-family:var(--text);font-size:20px;font-weight:600;color:#5b6674;margin-top:6px;letter-spacing:0">Growth & Pro plans</span>':''}</div><div class="ring" id="fr${i}"></div></div>`}).join('')}
  </div>`,
  update(t,$){
    R($('#f1'),t,.3,8.6); R($('#f2'),t,.7,8.6);
    const zoom=P(t,8.8,10.6,E.inOut);
    S($('#grid'),{y:-150*zoom,s:lerp(1,1.08,zoom)});
    FEAT.forEach((f,i)=>{
      const a=1.4+i*.2, k=P(t,a,a+1,E.out);
      // after the build, light each card in turn
      const h0=10.4+i*.78, hl=P(t,h0,h0+.35)*(1-P(t,h0+.9,h0+1.3));
      S($('#fc'+i),{o:P(t,a,a+.6),y:(1-k)*60,s:lerp(.92,1,k)*(1+hl*.04)});
      $('#fr'+i).style.opacity=hl.toFixed(3);
    });
  }});

/* 5. Inbox */
const MSG=[
  ['Dana K.','DK','#5e5ce6','Email','#004aad','Quick question about my invoice'],
  ['Mike R.','MR','#0a84ff','Facebook','#0a84ff','Can I get a quote for next week?'],
  ['Jess T.','JT','#ff375f','Instagram','#ff5ca8','Love your work! What does it cost?'],
  ['Carlos V.','CV','#30b0c7','WhatsApp','#25d366','Running 10 minutes late'],
  ['Priya S.','PS','#ff9f0a','SMS','#30d158','Can we move my booking?'],
  ['Website visitor','WV','#6e9bd1','Live chat','#1f5fc4','Do you service the Westside?']
];
addScene({dur:18,theme:'dark',html:`
  <div class="abs" style="left:120px;top:290px;width:700px">
    <div class="eyebrow grad" id="i0">Unified Inbox</div>
    <div class="h2" id="i1" style="font-size:78px">One inbox.</div>
    <div class="h2 muted" id="i2" style="font-size:78px;white-space:nowrap">Every conversation.</div>
    <div class="sub" id="i3" style="margin-top:34px">Texts, email, Facebook, Instagram, WhatsApp and live chat. All in one place.</div>
  </div>
  <div class="win" id="iw" style="left:860px;top:150px;width:920px;height:780px">
    <div class="winbar"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i><span style="margin-left:18px;font-size:20px;color:var(--gray);font-weight:600">Conversations</span></div>
    <div class="abs" style="left:0;top:56px;width:380px;height:724px;overflow:hidden;border-right:1px solid var(--line)" id="list">
      <div class="abs" id="sel" style="left:0;top:0;width:380px;height:104px;background:var(--panel2);opacity:0"></div>
      ${MSG.map((m,i)=>`<div class="row" id="r${i}"><div class="av" style="background:${m[2]}">${m[1]}</div><div><div class="rname">${m[0]}<span class="tag" style="background:${m[4]}">${m[3]}</span></div><div class="rprev">${m[5]}</div></div></div>`).join('')}
    </div>
    <div class="abs" style="left:380px;top:56px;width:540px;height:724px" id="conv">

  for(const sc of SCENES){
    const t=T-sc.start;
    if(t<0||t>sc.dur){sc.el.style.display='none';continue;}
    sc.el.style.display='block';
    const fo=sc.fadeOut||FADE;
    sc.el.style.opacity=(P(t,0,FADE,E.inOut)*(1-P(t,sc.dur-fo,sc.dur,E.inOut))).toFixed(4);
    sc.update(t,sc.$);
  }
}
window.renderAt=renderAt; window.DURATION=DURATION;

/* ---------- preview player ---------- */
const isRender=new URLSearchParams(location.search).has('render');
function fit(){const s=isRender?1:Math.min(innerWidth/1920,(innerHeight-(isRender?0:50))/1080);stage.style.transform=`scale(${s})`;stage.style.left=((innerWidth-1920*s)/2)+'px';}
addEventListener('resize',fit); fit();
if(isRender){document.body.classList.add('render');renderAt(0);}
else{
  let T=parseFloat(new URLSearchParams(location.search).get('t')||0), playing=true, last=performance.now();
  const scrub=document.getElementById('scrub'), tc=document.getElementById('tc'), btn=document.getElementById('play');
  const fmt=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
  btn.onclick=()=>{playing=!playing;btn.textContent=playing?'Pause':'Play'};
  scrub.oninput=()=>{T=scrub.value/1000*DURATION};
  addEventListener('keydown',e=>{if(e.code==='Space'){btn.click();e.preventDefault()} if(e.code==='ArrowRight')T=Math.min(DURATION,T+5); if(e.code==='ArrowLeft')T=Math.max(0,T-5);});
  (function loop(now){const dt=(now-last)/1000;last=now;if(playing){T+=dt;if(T>DURATION)T=0;}
    renderAt(T);scrub.value=T/DURATION*1000;tc.textContent=`${fmt(T)} / ${fmt(DURATION)}`;requestAnimationFrame(loop);})(last);
}
</script>
</body>
